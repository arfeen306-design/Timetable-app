[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "web/**", "core/**", "solver/**", "models/**", "utils/**", "exports/**", "database/**", "Dockerfile", "requirements-server.txt"]

[deploy]
serviceName = "timetable-api"
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port ${PORT}"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.healthcheck]
path = "/"
interval = 10
timeout = 5
